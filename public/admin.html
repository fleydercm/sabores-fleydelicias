<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Sabores Fleydelicias</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-6xl mx-auto p-4">
        <header class="flex justify-between items-center bg-white p-4 rounded-xl shadow-md mb-6">
            <h1 class="text-xl font-bold text-gray-800">Panel de Administración - Sabores Fleydelicias</h1>
            <button id="btnLogout" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md font-medium text-sm transition">Cerrar Sesión</button>
        </header>
        
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Pedidos Recibidos</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 border-b text-gray-700 text-sm">
                            <th class="p-3">ID / Fecha</th>
                            <th class="p-3">Cliente</th>
                            <th class="p-3">Teléfono</th>
                            <th class="p-3">Dirección</th>
                            <th class="p-3">Cantidad</th>
                            <th class="p-3">Comprobante</th>
                            <th class="p-3">Estado</th>
                            <th class="p-3">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaPedidos" class="text-sm text-gray-600">
                        <!-- Los pedidos se cargarán aquí -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Validación estricta de sesión mediante localStorage
        if (localStorage.getItem('admin') !== 'true') {
            window.location.href = '/login.html';
        }

        // Botón de cerrar sesión
        document.getElementById('btnLogout').addEventListener('click', () => {
            localStorage.removeItem('admin');
            window.location.href = '/login.html';
        });

        // Cargar pedidos desde el servidor
        async function cargarPedidos() {
            try {
                const res = await fetch('/api/pedidos');
                const pedidos = await res.json();
                const tbody = document.getElementById('tablaPedidos');
                tbody.innerHTML = '';

                if (!Array.isArray(pedidos) || pedidos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="p-4 text-center text-gray-500">No hay pedidos registrados.</td></tr>';
                    return;
                }

                pedidos.forEach(p => {
                    const tr = document.createElement('tr');
                    tr.className = 'border-b hover:bg-gray-50';
                    tr.innerHTML = `
                        <td class="p-3">${p.id}<br><span class="text-xs text-gray-400">${p.fecha}</span></td>
                        <td class="p-3 font-medium text-gray-800">${p.nombre}</td>
                        <td class="p-3">${p.telefono}</td>
                        <td class="p-3">${p.direccion}</td>
                        <td class="p-3">${p.cantidad}</td>
                        <td class="p-3">
                            ${p.comprobante && p.comprobante !== 'No adjuntado' ? `<a href="/uploads/${p.comprobante}" target="_blank" class="text-amber-600 underline font-medium">Ver foto</a>` : 'Sin foto'}
                        </td>
                        <td class="p-3">
                            <span class="px-2 py-1 rounded text-xs font-semibold ${p.estado === 'Completado' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">${p.estado}</span>
                        </td>
                        <td class="p-3 space-x-2">
                            <button onclick="cambiarEstado(${p.id})" class="bg-blue-500 text-white px-2 py-1 rounded text-xs hover:bg-blue-600">Completar</button>
                            <button onclick="eliminarPedido(${p.id})" class="bg-red-500 text-white px-2 py-1 rounded text-xs hover:bg-red-600">Eliminar</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error('Error al cargar pedidos:', err);
            }
        }

        async function cambiarEstado(id) {
            try {
                await fetch(`/api/pedidos/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ estado: 'Completado' })
                });
                cargarPedidos();
            } catch (err) {
                alert('Error al actualizar el estado');
            }
        }

        async function eliminarPedido(id) {
            if (!confirm('¿Estás seguro de eliminar este pedido?')) return;
            try {
                await fetch(`/api/pedidos/${id}`, { method: 'DELETE' });
                cargarPedidos();
            } catch (err) {
                alert('Error al eliminar el pedido');
            }
        }

        cargarPedidos();
    </script>
</body>
</html>
