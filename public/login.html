<form class="space-y-4" onsubmit="return false;">
    <div>
        <label class="block text-sm font-medium text-gray-700">Usuario</label>
        <input type="text" id="username" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700">Contraseña</label>
        <input type="password" id="password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
    </div>
    <button type="button" id="btnEntrar" class="w-full py-2 px-4 rounded-md text-white bg-red-600 hover:bg-red-700">
        Entrar
    </button>
</form>

<script>
    document.getElementById('btnEntrar').addEventListener('click', async function() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
            alert('Por favor completa todos los campos');
            return;
        }

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                window.location.href = '/admin';
            } else {
                alert(data.message || 'Credenciales inválidas');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Error de conexión con el servidor');
        }
    });
</script>
