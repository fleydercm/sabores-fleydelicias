<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Admin</title>
    <style>
        body { font-family: Arial; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        #mensaje { margin-top: 15px; text-align: center; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="titulo">Iniciar Sesión</h2>
        <input type="text" id="user" placeholder="Usuario">
        <input type="password" id="pass" placeholder="Contraseña">
        <button id="btnAccion" onclick="procesar()">Entrar</button>
        <div id="mensaje"></div>
    </div>

    <script>
        // Al cargar la página, revisamos si ya existe un admin creado en el sistema
        window.onload = async () => {
            const res = await fetch('/api/verificar-admin');
            const data = await res.json();
            
            if (!data.creado) {
                document.getElementById('titulo').innerText = 'Crear tu Usuario';
                document.getElementById('btnAccion').innerText = 'Registrar Credenciales';
                document.getElementById('btnAccion').style.background = '#28a745';
                window.esRegistro = true;
            }
        };

        async function procesar() {
            const usuario = document.getElementById('user').value;
            const password = document.getElementById('pass').value;
            const mensajeDiv = document.getElementById('mensaje');

            if (!usuario || !password) {
                mensajeDiv.style.color = 'red';
                mensajeDiv.innerText = 'Llena todos los campos';
                return;
            }

            const endpoint = window.esRegistro ? '/api/crear-admin' : '/api/login';

            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario, password })
            });

            const data = await res.json();

            if (data.success) {
                if (window.esRegistro) {
                    alert('¡Usuario creado con éxito! Ahora inicia sesión.');
                    window.location.reload();
                } else {
                    // Guardamos la sesión localmente y entramos al panel
                    localStorage.setItem('admin_logueado', 'true');
                    // Guardamos la sesión localmente y entramos al panel
localStorage.setItem('admin_logueado', 'true');
localStorage.setItem('usuario_actual', usuario); // ¡Agrega esta línea aquí!
window.location.href = '/admin';
                    window.location.href = '/admin';
                }
            } else {
                mensajeDiv.style.color = 'red';
                mensajeDiv.innerText = data.mensaje || 'Datos incorrectos';
            }
        }
    </script>
    <!-- Opción para cambiar contraseña desde el login -->
    <div class="mt-6 text-center border-t pt-4">
        <button onclick="toggleCambioCredenciales()" type="button" class="text-xs text-amber-700 hover:underline font-semibold focus:outline-none">
            ¿Deseas cambiar tu usuario o contraseña? ⚙️
        </button>
    </div>

    <!-- Panel oculto para actualizar datos -->
    <div id="panelCambioLogin" class="mt-4 p-4 bg-gray-50 rounded-xl border border-gray-200" style="display: none;">
        <h4 class="text-sm font-bold text-gray-700 mb-2">Actualizar Datos de Acceso</h4>
        <input type="text" id="nuevoUserLogin" placeholder="Nuevo Usuario" class="w-full p-2 mb-2 border rounded-lg text-sm">
        <input type="password" id="nuevoPassLogin" placeholder="Nueva Contraseña" class="w-full p-2 mb-2 border rounded-lg text-sm">
        
        <div class="flex gap-2">
            <button onclick="actualizarDesdeLogin()" type="button" class="bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs px-3 py-2 rounded-lg flex-1">
                Guardar Cambios
            </button>
            <button onclick="toggleCambioCredenciales()" type="button" class="bg-gray-300 hover:bg-gray-400 text-gray-700 font-bold text-xs px-3 py-2 rounded-lg">
                Cancelar
            </button>
        </div>
        <p id="mensajeLoginCambio" class="text-xs mt-2 font-semibold text-center"></p>
    </div>

    <script>
        function toggleCambioCredenciales() {
            const panel = document.getElementById('panelCambioLogin');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        async function actualizarDesdeLogin() {
            const usuario = document.getElementById('nuevoUserLogin').value;
            const password = document.getElementById('nuevoPassLogin').value;
            const mensaje = document.getElementById('mensajeLoginCambio');

            if (!usuario || !password) {
                mensaje.style.color = 'red';
                mensaje.innerText = 'Llena ambos campos';
                return;
            }

            const res = await fetch('/api/actualizar-admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario, password })
            });

            const data = await res.json();
            mensaje.style.color = data.success ? 'green' : 'red';
            mensaje.innerText = data.mensaje;

            if (data.success) {
                setTimeout(() => {
                    window.location.reload();
                }, 2000);
            }
        }
    </script>
</body>
</html>
