<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md w-90 max-w-md">
        <h2 id="titulo" class="text-xl font-bold mb-4 text-center text-gray-800">Panel de Administración</h2>
        <form class="space-y-4" onsubmit="return false;">
            <div>
                <label class="block text-sm font-medium text-gray-700">Usuario</label>
                <input type="text" id="username" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Contraseña</label>
                <input type="password" id="password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500">
            </div>
            <button type="button" id="btnEntrar" class="w-full py-2 px-4 rounded-md text-white bg-amber-600 hover:bg-amber-700 font-bold transition">
                Entrar
            </button>
        </form>
        <div id="mensaje" class="mt-3 text-center text-sm"></div>
    </div>

    <script>
        document.getElementById('btnEntrar').addEventListener('click', async function() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const mensaje = document.getElementById('mensaje');

            if (!username || !password) {
                mensaje.textContent = 'Por favor completa todos los campos';
                mensaje.className = 'mt-3 text-center text-sm text-red-600 font-medium';
                return;
            }

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('admin', 'true');
                    window.location.href = '/admin';
                } else {
                    mensaje.textContent = data.message || 'Credenciales inválidas';
                    mensaje.className = 'mt-3 text-center text-sm text-red-600 font-medium';
                }
            } catch (error) {
                console.error('Error:', error);
                mensaje.textContent = 'Error de conexión con el servidor';
                mensaje.className = 'mt-3 text-center text-sm text-red-600 font-medium';
            }
        });
    </script>
</body>
</html>
