<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sabores Fleydelicias</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen font-sans">
    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-sm border border-gray-200">
        <h1 class="text-xl font-black text-amber-800 text-center mb-1">Sabores Fleydelicias</h1>
        <p class="text-xs text-gray-500 text-center mb-6">Panel de Administración</p>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-[10px] font-bold text-gray-600 uppercase mb-1">Usuario</label>
                <input type="text" id="usuario" required class="w-full p-3 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="Ingresa tu usuario">
            </div>
            <div>
                <label class="block text-[10px] font-bold text-gray-600 uppercase mb-1">Contraseña</label>
                <input type="password" id="password" required class="w-full p-3 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold p-3 rounded-xl transition text-xs uppercase tracking-wide">
                Entrar al Panel
            </button>
        </form>
        <p id="errorMsg" class="text-red-600 text-xs text-center mt-4 font-semibold hidden"></p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.classList.add('hidden');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Marcamos el localStorage que exige admin.html
                    localStorage.setItem('admin_logueado', 'true');
                    localStorage.setItem('usuario_actual', usuario);
                    window.location.href = '/admin.html';
                } else {
                    errorMsg.textContent = data.message || 'Usuario o contraseña incorrectos';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                console.error('Error de red:', err);
                errorMsg.textContent = 'Error de conexión con el servidor.';
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
